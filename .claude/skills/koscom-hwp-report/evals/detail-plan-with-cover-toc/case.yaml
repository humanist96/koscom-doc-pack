name: detail-plan-with-cover-toc
expected_outcome: |
  생성형AI_업무혁신_추진계획.hwp 가 코스콤 상세보고 서식으로 만들어지고 정상으로 열린다.
  표지(제목, 2026.11, 디지털혁신본부·AI전략팀, 담당자 줄)와 목차(I~IV 장, II·III의 절)가 있고,
  본문은 장 제목 박스(I. 추진 배경 …), 절 박스(1 사내 현황 …), 개조식 항목으로 구성된다.
  요청의 수치(10곳 중 7곳, 32%, 40명, 25%, 30%/4만 시간, 4시간→1시간)가 빠짐없이 들어가고,
  추진 일정 표(과제 × 1~4분기, ● 표시)가 있다. 목차 쪽번호가 실제 쪽과 맞는다.
