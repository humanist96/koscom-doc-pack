schema_version: "1.1"
name: summary-with-performance-table
expected_outcome: |
  3분기_금융영업_실적보고.hwp 가 코스콤 요약보고 서식으로 만들어지고 정상으로 열린다.
  지점별 실적 표(권역/담당/신규 건수/계약금액/목표 대비 5열, 4개 행)가 들어가며 권역 칸이 수도권·지방으로 세로 병합된다.
  실적 요약(14건, 38.6억원, 110%, 클라우드 원장 9건, 해지 1건)과 4분기 계획 2개가 개조식으로 들어가고,
  뒤에 "주요 계약 목록" 참고 자료(3개 계약)가 붙는다. 지어낸 수치가 없다.
